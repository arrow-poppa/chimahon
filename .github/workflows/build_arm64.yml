name: Build ARM64 APK

on:
  push:
    branches:
      - agent/byok-ai-arm64
      - agent/byok-ai-official-streaming
      - agent/byok-ai-v2.4.0
      - agent/byok-ai-v2.4.1
      - agent/byok-ai-v2.4.7
      - agent/byok-ai-v2.4.7-ocr-models
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64-v8a preview
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Restore persistent preview signing key
        env:
          CHIMAHON_PREVIEW_KEYSTORE_BASE64: ${{ secrets.CHIMAHON_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CHIMAHON_PREVIEW_KEYSTORE_BASE64" ]; then
            echo "::error::CHIMAHON_PREVIEW_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$CHIMAHON_PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          certificate_sha="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | sha256sum | cut -d ' ' -f 1)"
          expected_sha="$(tr -d '\r\n' < tools/android/preview-signing.sha256)"
          if [ "$certificate_sha" != "$expected_sha" ]; then
            echo "::error::Preview signing key differs from the previous builds"
            exit 1
          fi

      - name: Test popup selection and Anki export in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/dictionary-browser/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/dictionary-browser" --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/dictionary-browser/node_modules/.bin/playwright" install --with-deps chromium
          node tools/dictionary/test-popup-selection.cjs

      - name: Run focused unit tests
        run: ./gradlew :chimahon:testDebugUnitTest --no-daemon

      - name: Test dictionary ordering, AI content and native subtitles
        run: >-
          ./gradlew :app:testPreviewUnitTest
          --tests "eu.kanade.tachiyomi.data.ocr.OcrEngineTypeTest"
          --tests "eu.kanade.tachiyomi.data.ocr.PaddleOcrBridgeTest"
          --tests "eu.kanade.tachiyomi.data.model.ModelBundleInstallerTest"
          --tests "eu.kanade.tachiyomi.ui.reader.setting.ReaderOcrSourceTest"
          --tests "eu.kanade.tachiyomi.ui.dictionary.DictionaryResultOrderingTest"
          --tests "eu.kanade.tachiyomi.ui.dictionary.AiExplanationContentTest"
          --tests "eu.kanade.tachiyomi.ui.player.controls.NativeSubtitleGeometryTest"
          --no-daemon

      - name: Verify published OCR model catalog
        run: |
          python3 - <<'PYTHON'
          import json, urllib.request
          manifest = json.load(urllib.request.urlopen('https://github.com/arrow-poppa/chimahon/releases/download/lookitan-ocr-v1/manifest.json'))
          sources = json.load(open('tools/ocr-models/models.json'))
          assert manifest['version'] == 'lookitan-ocr-v1'
          assert set(manifest['components']) == {'paddle_' + name for name in sources} | {'paddle_runtime'}
          PYTHON

      - name: Build ARM64 APK
        run: ./gradlew :app:assemblePreview -PtargetAbis=arm64-v8a --no-daemon

      - name: Verify persistent APK signature and package
        run: |
          for apk in app/build/outputs/apk/preview/*arm64-v8a*.apk; do
            python3 tools/android/verify-preview-apk.py "$apk"
          done

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chimahon-arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/preview/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 7
