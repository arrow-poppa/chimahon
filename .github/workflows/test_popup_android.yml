name: Android popup selection

on:
  push:
    branches: [agent/byok-ai-v2.4.7-ocr-models, agent/byok-ai-v2.4.8-ocr-models]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: popup-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Checkout submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-read-only: false
      - name: Resolve Android test dependencies
        run: ./gradlew :app:checkDebugAndroidTestAarMetadata -PtargetAbis=x86_64 -PnativeSelectionTests=true --no-daemon
      - name: Compile app and native selection tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PtargetAbis=x86_64 -PnativeSelectionTests=true --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native long press on Android 13
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/dictionary/run-android-selection.sh
      - name: Upload Android selection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-13-popup-selection-${{ github.sha }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/selection-evidence
          if-no-files-found: warn
